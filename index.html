  return `You are helping someone with a genuine, real relationship to ${AGENT_NAME} write their own Google review of their honest experience. This is most often a past buying/selling/renting client, but can also be a landlord using his property management services, a referral partner (lender, title company, another agent), or a friend/colleague who genuinely worked with or was helped by ${AGENT_NAME} — treat all of these as legitimate as long as the relationship is real. ${AGENT_NAME} is a ${AGENT_ROLE} serving ${AREAS_SERVED}, and when the client is ready to post, their review goes here: ${REVIEW_LINK}. You are talking to the REVIEWER, not the agent. Your job is to turn their real experience into clear, specific words, then hand them a draft they own, can edit, and post themselves. You are an articulation aid — never a script. Always refer to the agent by name when you speak with them.

${langLine}

HARD RULES (non-negotiable — apply to every interaction)

- Ask in grouped, open, story-style prompts, one at a time — never a long list. It should feel like a conversation, never a form or an interrogation.

WHAT TO LISTEN FOR (the Nouns / Verbs / Modifiers lens)
You are not extracting keywords to insert. You are listening for the real specifics in their story so the review is concrete instead of generic (like "my agent was great to work with"). Across the conversation, naturally capture whatever they actually share:
- Nouns — who they worked with; the kind of property (historic home, condo, waterfront, first place); the area or neighborhood; their situation (first-time buyer, relocating, downsizing, investor).
- Verbs — what happened (bought, sold, listed, leased, relocated, upgraded).

If the client dumps their whole story in one message, work with that directly instead of re-asking things they already covered.
Otherwise, ask in small groups, one at a time, and stop early once you have enough:
1. The move — "Quick version: were you buying, selling, or renting, and what kind of place / what area?"
2. The experience — "What was going on for you at the time, and how did they help? Anything that stood out — a tricky moment they got you through, something they did really well?"
3. The bottom line (this is where strong words surface) — invite the client to reach for their best, most evaluative language with open questions like:

const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const headlineEl = document.getElementById('headlineText');
const sublineEl = document.getElementById('sublineText');
const footerEl = document.getElementById('footerText');
const micHintText = document.getElementById('micHintText');
const htmlEl = document.documentElement;

function addMessage(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = linkify(text);
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function linkify(text){
  const escaped = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return escaped.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

function showTyping(){
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function hideTyping(){
  const el = document.getElementById('typingIndicator');
  if(el) el.remove();
}

let latestDraft = null;
const draftBar = document.getElementById('draftBar');
const draftLabelEl = document.getElementById('draftLabelText');
const copyDraftBtn = document.getElementById('copyDraftBtn');
const goReviewBtn = document.getElementById('goReviewBtn');

function extractDraft(text){
  const match = text.match(/<<<DRAFT>>>([\s\S]*?)<<<END_DRAFT>>>/);
  if(!match) return null;
  return match[1].trim();
}

function stripMarkers(text){
  return text.replace(/<<<DRAFT>>>/g, '').replace(/<<<END_DRAFT>>>/g, '').trim();
}

copyDraftBtn.addEventListener('click', async () => {
  if(!latestDraft) return;
  try{
    await navigator.clipboard.writeText(latestDraft);
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = latestDraft;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  copyDraftBtn.textContent = T[LANG].copiedBtn;
  copyDraftBtn.classList.add('copied');
  setTimeout(() => {
    copyDraftBtn.textContent = T[LANG].copyBtn;
    copyDraftBtn.classList.remove('copied');
  }, 2000);
});

goReviewBtn.addEventListener('click', () => {
  window.open(REVIEW_LINK, '_blank', 'noopener');
});

async function callClaude(){
  showTyping();
  sendBtn.disabled = true;
  try{
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        system: buildSystemPrompt(LANG, otherPath),
        messages: history
      })
    });
    const data = await response.json();
    hideTyping();
    const textBlocks = (data.content || []).filter(b => b.type === "text").map(b => b.text);
    const rawReply = textBlocks.join("\n") || T[LANG].errorTech;
    history.push({ role: "assistant", content: rawReply });

    const draft = extractDraft(rawReply);
    if(draft){
      latestDraft = draft;
      draftBar.style.display = 'flex';
      copyDraftBtn.textContent = T[LANG].copyBtn;
      copyDraftBtn.classList.remove('copied');
    }
    addMessage('assistant', stripMarkers(rawReply));
  }catch(err){
    hideTyping();
    addMessage('assistant', T[LANG].errorConn);
  }finally{
    sendBtn.disabled = false;
  }
}

function sendUserMessage(){
  const text = inputEl.value.trim();
  if(!text) return;
  history.push({ role: "user", content: text });
  addMessage('user', text);
  inputEl.value = '';
  inputEl.style.height = 'auto';
  callClaude();
}

sendBtn.addEventListener('click', sendUserMessage);
inputEl.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendUserMessage();
  }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

// ---- Quick-start chips ----
let selectedType = null;
let selectedZone = null;
let quickStartActive = false;

function renderQuickStart(){
  quickStartActive = true;
  const t = T[LANG];
  const panel = document.createElement('div');
  panel.className = 'quick-start';
  panel.id = 'quickStart';

  const typeLabel = document.createElement('span');
  typeLabel.className = 'qs-group-label';
  typeLabel.textContent = t.qsTypeLabel;
  panel.appendChild(typeLabel);

  const typeRow = document.createElement('div');
  typeRow.className = 'chip-row';
  const typeEntries = [
    { key: 'compre', label: t.types.compre },
    { key: 'vende', label: t.types.vende },
    { key: 'rento', label: t.types.rento },
    { key: 'admin', label: t.types.admin },
    { key: 'otro', label: t.types.otro, other: true }
  ];
  typeEntries.forEach(pt => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = pt.label;
    btn.addEventListener('click', () => {
      if(pt.other){
        otherPath = true;
        panel.remove();
        quickStartActive = false;
        inputEl.placeholder = t.otherPlaceholder;
        inputEl.focus();
        return;
      }
      selectedType = t.composeType[pt.key];
      [...typeRow.children].forEach(c => c.classList.remove('selected'));
      btn.classList.add('selected');
      updateContinueState();
    });
    typeRow.appendChild(btn);
  });
  panel.appendChild(typeRow);

  const zoneLabel = document.createElement('span');
  zoneLabel.className = 'qs-group-label';
  zoneLabel.textContent = t.qsZoneLabel;
  panel.appendChild(zoneLabel);

  const zoneRow = document.createElement('div');
  zoneRow.className = 'chip-row';
  const zoneOptions = [...ZONE_NAMES, t.zoneOther];
  zoneOptions.forEach(z => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = z;
    btn.addEventListener('click', () => {
      if(z === t.zoneOther){
        [...zoneRow.children].forEach(c => c.classList.remove('selected'));
        selectedZone = null;
        panel.remove();
        quickStartActive = false;
        inputEl.placeholder = t.zoneOtherPlaceholder;
        inputEl.focus();
        return;
      }
      selectedZone = z;
      [...zoneRow.children].forEach(c => c.classList.remove('selected'));
      btn.classList.add('selected');
      updateContinueState();
    });
    zoneRow.appendChild(btn);
  });
  panel.appendChild(zoneRow);

  const continueBtn = document.createElement('button');
  continueBtn.className = 'qs-continue';
  continueBtn.id = 'qsContinue';
  continueBtn.textContent = t.qsContinue;
  continueBtn.addEventListener('click', () => {
    if(!selectedType) return;
    const composed = selectedZone
      ? `${selectedType}, ${t.connector} ${selectedZone}.`
      : `${selectedType}.`;
    panel.remove();
    quickStartActive = false;
    history.push({ role: "user", content: composed });
    addMessage('user', composed);
    callClaude();
  });
  panel.appendChild(continueBtn);

  chatEl.appendChild(panel);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function updateContinueState(){
  const btn = document.getElementById('qsContinue');
  if(!btn) return;
  if(selectedType) btn.classList.add('enabled');
  else btn.classList.remove('enabled');
}

// ---- Voice dictation (Web Speech API) ----
const micBtn = document.getElementById('micBtn');
const micHintEl = document.getElementById('micHint');
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isRecording = false;
let baseText = '';

if(SpeechRecognitionAPI){
  micBtn.style.display = 'flex';
  micHintEl.style.display = 'none';

  recognition = new SpeechRecognitionAPI();
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onresult = (event) => {
    let interim = '';
    let final = '';
    for(let i = event.resultIndex; i < event.results.length; i++){
      const transcript = event.results[i][0].transcript;
      if(event.results[i].isFinal) final += transcript;
      else interim += transcript;
    }
    if(final) baseText += final;
    inputEl.value = (baseText + interim).trim();
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  };

  recognition.onerror = () => {
    isRecording = false;
    micBtn.classList.remove('recording');
  };

  recognition.onend = () => {
    isRecording = false;
    micBtn.classList.remove('recording');
  };

  micBtn.addEventListener('click', () => {
    if(isRecording){
      recognition.stop();
      isRecording = false;
      micBtn.classList.remove('recording');
    }else{
      recognition.lang = T[LANG].recogLang;
      baseText = inputEl.value ? inputEl.value + ' ' : '';
      try{
        recognition.start();
        isRecording = true;
        micBtn.classList.add('recording');
      }catch(e){ /* already started, ignore */ }
    }
  });
}

// ---- Language toggle ----
const langButtons = document.querySelectorAll('.lang-toggle button');

function applyStaticText(){
  const t = T[LANG];
  headlineEl.textContent = t.headline;
  sublineEl.textContent = t.subline;
  footerEl.textContent = t.footer;
  inputEl.placeholder = t.inputPlaceholder;
  micHintText.textContent = t.micHint;
  draftLabelEl.textContent = t.draftLabel;
  if(latestDraft){
    copyDraftBtn.textContent = t.copyBtn;
    copyDraftBtn.classList.remove('copied');
  }
  goReviewBtn.textContent = t.goBtn;
  htmlEl.setAttribute('lang', t.htmlLang);
  langButtons.forEach(b => b.classList.toggle('active', b.dataset.lang === LANG));
}

function setLanguage(newLang){
  if(newLang === LANG) return;
  const conversationStarted = history.some(m => m.role === 'user');
  LANG = newLang;
  applyStaticText();

  if(!conversationStarted){
    chatEl.innerHTML = '';
    history = [];
    selectedType = null;
    selectedZone = null;
    otherPath = false;
    const g = T[LANG].greeting;
    history.push({ role: "assistant", content: g });
    addMessage('assistant', g);
    renderQuickStart();
  }else{
    const note = document.createElement('div');
    note.className = 'msg system-note';
    note.textContent = T[LANG].switchNote;
    chatEl.appendChild(note);
    chatEl.scrollTop = chatEl.scrollHeight;
    if(quickStartActive){
      const existing = document.getElementById('quickStart');
      if(existing) existing.remove();
      selectedType = null;
      selectedZone = null;
      renderQuickStart();
    }
  }
  inputEl.focus();
}

langButtons.forEach(btn => {
  btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
});

// ---- Init ----
applyStaticText();
history.push({ role: "assistant", content: T[LANG].greeting });
addMessage('assistant', T[LANG].greeting);
renderQuickStart();
inputEl.focus();
</script>
